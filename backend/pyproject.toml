[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "credence-backend"
version = "0.1.0"
description = "AI news verification backend"
authors = [{name = "Credence Team"}]
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.23",
  "pydantic>=2.5",
  "pydantic-settings>=2.1",
  "sqlalchemy>=2.0",
  "alembic>=1.12",
  "httpx>=0.25",
  "python-dotenv>=1.0",
  "openai>=1.10",
  "beautifulsoup4>=4.12",
  "newspaper3k>=0.2.8",
  "nltk>=3.8",
  "scikit-learn>=1.3",
  "numpy>=1.24",
  "pandas>=2.1",
  "tenacity>=8.2",
  "python-multipart>=0.0.6",
  "aiosqlite>=0.19",
]

[tool.setuptools.packages.find]
where = ["app"]


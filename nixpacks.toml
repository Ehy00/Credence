# Nixpacks configuration for Railway
# This helps Railway detect Python and build from backend directory

[phases.setup]
nixPkgs = ["python311", "pip"]

[phases.install]
cmds = ["cd backend && pip install -e ."]

[phases.build]
cmds = ["cd backend && echo 'Build complete'"]

[start]
cmd = "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"


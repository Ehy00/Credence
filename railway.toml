# Railway configuration file
# Note: Railway will auto-detect Python from backend/ directory
# The root directory should be set to "backend" in Railway UI Settings

[build]
builder = "NIXPACKS"

[deploy]
startCommand = "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

